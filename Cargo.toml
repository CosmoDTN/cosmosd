[package]
name = "cosmosd"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Delay-tolerant streaming daemon — stream across the void"
license = "MIT"
repository = "https://github.com/CosmoDTN/cosmosd"

[[bin]]
name = "cosmosd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP API (local REST for SDK + ingest)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage (content-addressed bundle store)
sled = "0.34"

# Crypto (bundle content addressing)
blake3 = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Time + IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.3"
mdns-sd = "0.10"
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
ciborium = "0.2"
serde_bytes = "0.11"
if-addrs = "0.13"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
data-encoding = "2.11.1"
bp7 = { version = "0.12.2", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
